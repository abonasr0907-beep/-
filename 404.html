    <!--
        GitHub Pages 404 redirect handler.
        When a user visits /property/{id}, GitHub Pages serves this 404.html.
        We redirect to property.html?id={id} for client-side rendering.
    -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "الرئيسية",
                "item": "https://abonasr0907-beep.github.io/-/"
            }
        ]
    }
    </script>
    <script>
        (function() {
            var path = window.location.pathname;
            // Handle /property/{id} pattern
            var match = path.match(/\/property\/([^\/?#]+)/);
            if (match) {
                var propertyId = match[1];
                // Determine base path (handles subdirectory hosting like /-/)
                var basePath = path.replace(/property\/.*$/, '');
                var redirectUrl = basePath + 'property.html?id=' + encodeURIComponent(propertyId);
                window.location.replace(redirectUrl);
                return;
            }
            // Handle SEO landing page clean URLs (without trailing slash)
            // e.g. /farms-riyadh → /farms-riyadh/
            var landingPages = [
                'farms-riyadh', 'farms-alkharj',
                'resthouses-riyadh', 'resthouses-alkharj',
                'lands-riyadh', 'lands-alkharj',
                'real-estate-riyadh', 'real-estate-alkharj',
                'property-management-riyadh',
                'well-drilling-services', 'well-location-services'
            ];
            var pathSegments = path.replace(/\/+$/, '').split('/');
            var lastSegment = pathSegments[pathSegments.length - 1];
            if (landingPages.indexOf(lastSegment) !== -1) {
                var basePath = path.replace(new RegExp(lastSegment + '.*$'), '');
                var redirectUrl = basePath + lastSegment + '/' + window.location.search + window.location.hash;
                window.location.replace(redirectUrl);
                return;
            }
            // Default: redirect to home
            var homePath = path.split('/').slice(0, -1).join('/') + '/';
            window.location.replace(homePath || './');
        })();
    </script>
